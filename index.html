document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"79d77d10-06c8-4208-9b0b-c108d4caca1f\"><\/script>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n  <title>What the floor told us | Nazdar Learning<\/title>\n  <meta name=\"description\" content=\"Executive briefing on Nazdar's 2026 frontline listening sessions.\">\n  <style>/* NAZDAR WEBFONTS — Campton (licensed, supplied by Nazdar Marketing Communications).\n   Weights map to the brand guide's four: Light 300 / Book 400 / Medium 500 / Bold 700.\n   SemiBold 600 and Black 900 are included for display use only.\n   OTF is served directly; ask Marketing for a woff2 kit if payload size matters. */\n\n<\/style>\n  <style>/* NAZDAR COLOR TOKENS\n   Source: Nazdar Logo Guidelines (2023), via nazdar-design-system/src/styles/tokens.css\n   BRAND layer    = in the official guide. Authoritative.\n   EXTENDED layer = added for UI usability. NOT approved by Marketing Communications. */\n\n:root{\n  /* ---- BRAND ---- */\n  --color-nz-red:#CF102D;        /* PMS 186  | 5.58:1  | fills, display, primary action */\n  --color-nz-red-dark:#A91623;   /* PMS 187  | 7.43:1  | brand text, links, hover */\n  --color-nz-green:#A3CF60;      /* PMS 367  | 1.80:1  | Ink Technologies, fill only */\n  --color-nz-green-dark:#7FA44C; /* PMS 576  | Ink Technologies, darker */\n  --color-nz-blue:#0099D6;       /* PMS 2925 | 3.22:1  | SourceOne */\n  --color-nz-blue-dark:#007CBA;  /* PMS 7461 | 4.57:1  | links, focus rings */\n  --color-nz-black:#000000;\n  --color-nz-gray-dark:#323E48;  /* PMS 432  | 10.95:1 | default body text */\n  --color-nz-gray-cool:#666666;  /* 5.74:1   | secondary text, captions */\n\n  /* ---- EXTENDED: neutral ramp, hue-matched to PMS 432 ---- */\n  --color-nz-neutral-50:#F7F8F9;\n  --color-nz-neutral-100:#EDEFF1;\n  --color-nz-neutral-200:#DDE1E5;\n  --color-nz-neutral-300:#C3C9CF;\n  --color-nz-neutral-400:#98A1AA;\n  --color-nz-neutral-500:#6B7580;\n  --color-nz-neutral-600:#4E5862;\n  --color-nz-neutral-700:#323E48;\n  --color-nz-neutral-800:#232C33;\n  --color-nz-neutral-900:#14191D;\n\n  /* ---- EXTENDED: feedback. Deliberately excludes brand red. ---- */\n  --color-nz-success:#2E7D4F;\n  --color-nz-success-bg:#EAF4EE;\n  --color-nz-success-text:#1E4F33;\n  --color-nz-warning:#B4690E;\n  --color-nz-warning-bg:#FDF3E3;\n  --color-nz-warning-text:#6E4109;\n  --color-nz-error:#8C1D2B;\n  --color-nz-error-bg:#FBEDEF;\n  --color-nz-error-text:#5E131D;\n  --color-nz-info:#007CBA;\n  --color-nz-info-bg:#E6F4FB;\n  --color-nz-info-text:#004E75;\n\n  /* ---- SEMANTIC. Components read these, never raw brand colors. ---- */\n  --nz-accent:var(--color-nz-red);\n  --nz-accent-dark:var(--color-nz-red-dark);  /* FILL ONLY. Hover/pressed fills. Not guaranteed to hold text. */\n  --nz-accent-ink:var(--color-nz-red-dark);  /* TEXT ONLY. Accent-colored text on a light surface. Always clears AA. */\n  --nz-accent-text:#FFFFFF;\n\n  --nz-text-primary:var(--color-nz-gray-dark);\n  --nz-text-secondary:var(--color-nz-gray-cool);\n  --nz-text-link:var(--color-nz-blue-dark);\n  --nz-border:var(--color-nz-neutral-200);\n  --nz-border-strong:var(--color-nz-neutral-300);\n  --nz-border-focus:var(--color-nz-blue-dark);\n  --nz-surface:#FFFFFF;\n  --nz-surface-sunken:var(--color-nz-neutral-50);\n}\n\n/* Division theming. The Z symbol stays red in all three logos, so only the\n   surrounding accent changes. Never recolor the Z.\n\n   --nz-accent-dark and --nz-accent-ink diverge on Ink Technologies and that is\n   deliberate. PMS 576 (#7FA44C) is 2.87:1 on white, so it can be a hover FILL\n   but never TEXT. Rather than invent a darker green outside the official nine,\n   Ink Technologies borrows PMS 432 for accent-colored text: brand-approved and\n   10.95:1. If Marketing Communications approves a darker green, set it here. */\n.nz-theme-master{--nz-accent:var(--color-nz-red);--nz-accent-dark:var(--color-nz-red-dark);--nz-accent-ink:var(--color-nz-red-dark);--nz-accent-text:#FFFFFF}\n.nz-theme-inktech{--nz-accent:var(--color-nz-green);--nz-accent-dark:var(--color-nz-green-dark);--nz-accent-ink:var(--color-nz-gray-dark);--nz-accent-text:var(--color-nz-neutral-900)}\n.nz-theme-sourceone{--nz-accent:var(--color-nz-blue);--nz-accent-dark:var(--color-nz-blue-dark);--nz-accent-ink:var(--color-nz-blue-dark);--nz-accent-text:#FFFFFF}\n\n/* CONFLICTS in the source PDF, unresolved. The guide's hex column disagrees with\n   its own RGB column twice; RGB matches the stated Pantone, so RGB wins.\n   1. Nazdar Red: RGB 207/16/45 = #CF102D (in use), not the guide's #D90000.\n   2. Dark Gray:  RGB 50/62/72  = #323E48 (in use), not the guide's #191919.\n   If Marketing rules the other way, change those two values here. Nothing else moves. */\n<\/style>\n  <style>/* NAZDAR TYPOGRAPHY TOKENS\n\n   Campton is the brand face in Light 300 / Book 400 / Medium 500 / Bold 700.\n   The licensed webfont ships with this system — see tokens/fonts.css.\n   The Calibri / Arial fallbacks stay in the stack: they are the guide's own\n   instruction for Microsoft Office output and for any surface that cannot\n   load the webfont. Never substitute a Google Font lookalike (Montserrat,\n   Poppins, Jost). */\n\n:root{\n  --font-display:\"Campton\", Calibri, Arial, Helvetica, sans-serif;\n  --font-body:\"Campton\", Calibri, Arial, Helvetica, sans-serif;\n  --font-mono:ui-monospace, \"SFMono-Regular\", Menlo, Consolas, monospace;\n\n  --nz-weight-light:300;\n  --nz-weight-book:400;\n  --nz-weight-medium:500;\n  --nz-weight-bold:700;\n\n  /* EXTENDED: 1.25 ratio on a 16px base */\n  --text-xs:0.75rem;     /* 12px */\n  --text-sm:0.875rem;    /* 14px */\n  --text-base:1rem;      /* 16px */\n  --text-lg:1.25rem;     /* 20px */\n  --text-xl:1.5625rem;   /* 25px */\n  --text-2xl:1.953rem;   /* 31px */\n  --text-3xl:2.441rem;   /* 39px */\n  --text-4xl:3.052rem;   /* 49px */\n\n  --nz-leading-none:1;\n  --nz-leading-tight:1.15;\n  --nz-leading-snug:1.35;\n  --nz-leading-body:1.55;\n\n  /* Negative tracking on display sizes, wide tracking on small caps labels */\n  --nz-tracking-tight:-0.02em;\n  --nz-tracking-label:0.08em;\n  --nz-tracking-label-wide:0.12em;\n}\n<\/style>\n  <style>/* NAZDAR SPACE, RADII, ELEVATION  (EXTENDED layer, not in the official guide)\n   Spacing runs on a 4px base. Radii stay tight: 2px to 8px. The Z symbol is\n   built from hard angular cuts, so heavy rounding fights the mark. */\n\n:root{\n  --nz-space-1:4px;\n  --nz-space-2:8px;\n  --nz-space-3:12px;\n  --nz-space-4:16px;\n  --nz-space-5:20px;\n  --nz-space-6:24px;\n  --nz-space-8:32px;\n  --nz-space-10:40px;\n  --nz-space-12:48px;\n  --nz-space-16:64px;\n\n  --radius-nz-sm:2px;\n  --radius-nz-md:4px;\n  --radius-nz-lg:8px;\n\n  /* Tinted with the cool blue-slate of PMS 432, never pure black. Never a glow. */\n  --shadow-nz-sm:0 1px 2px rgba(20,25,29,0.08);\n  --shadow-nz-md:0 2px 8px rgba(20,25,29,0.10);\n  --shadow-nz-lg:0 8px 24px rgba(20,25,29,0.12);\n\n  --nz-content-max:1080px; /* @kind spacing */\n  --nz-duration:200ms; /* @kind other */\n  --nz-ease:ease; /* @kind other */\n}\n<\/style>\n  <style>/* NAZDAR BASE. Surfaces are white. Backgrounds are white or a very light cool\n   gray, never colored fields. */\n\nbody{\n  margin:0;\n  background:var(--nz-surface);\n  color:var(--nz-text-primary);\n  font-family:var(--font-body);\n  font-size:var(--text-base);\n  line-height:var(--nz-leading-body);\n  -webkit-font-smoothing:antialiased;\n}\n\na{color:var(--nz-text-link);text-decoration:underline;text-underline-offset:2px}\na:hover{color:var(--color-nz-red-dark)}\n\nh1,h2,h3,h4{font-family:var(--font-display);font-weight:var(--nz-weight-bold);line-height:var(--nz-leading-tight);letter-spacing:var(--nz-tracking-tight);margin:0}\ncode,kbd,pre{font-family:var(--font-mono)}\n\n*:focus-visible{outline:2px solid var(--nz-border-focus);outline-offset:2px}\n\n/* Small uppercase label, the brand's one recurring text device */\n.nz-label{font-size:var(--text-xs);font-weight:var(--nz-weight-bold);text-transform:uppercase;letter-spacing:var(--nz-tracking-label-wide);color:var(--nz-text-secondary)}\n\n/* Angular red rule. A structural echo of the mark's diagonal cut, not a\n   reproduction of it. Never a gradient. */\n.nz-rule-diagonal{height:6px;background:var(--nz-accent);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}\n\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation-duration:0.01ms !important;transition-duration:0.01ms !important}\n}\n<\/style>\n  <style>/* Nazdar component styles. Values transcribed exactly from the source Tailwind\n   utility strings in nazdar-design-system/src/components/*.jsx. No hex here. */\n\n/* ---- Button ---- */\n.nz-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--nz-space-2);font-family:var(--font-body);font-weight:var(--nz-weight-bold);cursor:pointer;border-radius:var(--radius-nz-md);border:1px solid transparent;transition:background-color var(--nz-duration) var(--nz-ease),color var(--nz-duration) var(--nz-ease),border-color var(--nz-duration) var(--nz-ease);text-decoration:none;line-height:var(--nz-leading-snug)}\n.nz-btn--sm{font-size:var(--text-sm);padding:6px 12px}\n.nz-btn--md{font-size:var(--text-base);padding:10px 18px}\n.nz-btn--lg{font-size:var(--text-lg);padding:12px 24px}\n.nz-btn--primary{background:var(--nz-accent);color:var(--nz-accent-text)}\n.nz-btn--primary:hover:not(:disabled){background:var(--nz-accent-dark)}\n.nz-btn--secondary{background:#fff;color:var(--nz-accent-ink);border-color:var(--nz-border-strong)}\n.nz-btn--secondary:hover:not(:disabled){background:var(--color-nz-neutral-50)}\n.nz-btn--destructive{background:var(--color-nz-error);color:#fff}\n.nz-btn--destructive:hover:not(:disabled){filter:brightness(0.9)}\n.nz-btn--quiet{background:transparent;color:var(--nz-text-link);text-decoration:underline;padding-left:6px;padding-right:6px}\n.nz-btn--quiet:hover:not(:disabled){color:var(--nz-accent-ink)}\n.nz-btn:disabled{cursor:not-allowed;background:var(--color-nz-neutral-300);color:var(--color-nz-neutral-500);border-color:transparent;filter:none}\n\n/* ---- Badge ---- */\n.nz-badge{display:inline-block;font-size:10px;font-weight:var(--nz-weight-bold);letter-spacing:0.1em;text-transform:uppercase;padding:3px 7px;border-radius:var(--radius-nz-sm);line-height:1.4}\n.nz-badge--brand{background:var(--color-nz-red-dark);color:#fff}\n.nz-badge--neutral{background:var(--color-nz-neutral-200);color:var(--color-nz-neutral-700)}\n.nz-badge--success{background:var(--color-nz-success-bg);color:var(--color-nz-success)}\n.nz-badge--warning{background:var(--color-nz-warning-bg);color:var(--color-nz-warning)}\n.nz-badge--error{background:var(--color-nz-error-bg);color:var(--color-nz-error)}\n\n/* ---- Card ---- */\n.nz-card{background:#fff;border:1px solid var(--nz-border);border-radius:var(--radius-nz-md);box-shadow:var(--shadow-nz-sm);overflow:hidden}\n.nz-card__head{background:var(--nz-accent);color:var(--nz-accent-text);padding:12px 16px}\n.nz-card__head p{margin:0;font-family:var(--font-display);font-weight:var(--nz-weight-bold);font-size:var(--text-lg)}\n.nz-card__body{padding:16px}\n\n/* ---- Alert. Hard left border, never an icon circle. ---- */\n.nz-alert{display:flex;gap:12px;padding:16px;margin-bottom:12px;border-radius:var(--radius-nz-md);border-left:4px solid;font-size:var(--text-sm)}\n.nz-alert__mark{font-weight:var(--nz-weight-bold);flex-shrink:0}\n.nz-alert__body strong{display:block}\n.nz-alert--success{background:var(--color-nz-success-bg);border-color:var(--color-nz-success);color:var(--color-nz-success-text)}\n.nz-alert--warning{background:var(--color-nz-warning-bg);border-color:var(--color-nz-warning);color:var(--color-nz-warning-text)}\n.nz-alert--error{background:var(--color-nz-error-bg);border-color:var(--color-nz-error);color:var(--color-nz-error-text)}\n.nz-alert--info{background:var(--color-nz-info-bg);border-color:var(--color-nz-info);color:var(--color-nz-info-text)}\n\n/* ---- Field: Input, Select ---- */\n.nz-field{max-width:24rem}\n.nz-field__label{display:block;font-size:var(--text-sm);font-weight:var(--nz-weight-bold);margin-bottom:8px;color:var(--color-nz-gray-dark)}\n.nz-field__control{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:var(--radius-nz-md);background:#fff;color:var(--color-nz-gray-dark);font-family:var(--font-body);font-size:var(--text-base);border:1px solid var(--nz-border-strong);transition:border-color var(--nz-duration) var(--nz-ease)}\n.nz-field__control::placeholder{color:var(--color-nz-neutral-400)}\n.nz-field__control:focus{border-color:var(--color-nz-blue-dark)}\n.nz-field__control--error,.nz-field__control--error:focus{border-color:var(--color-nz-error)}\n.nz-field__control:disabled{background:var(--color-nz-neutral-50);color:var(--color-nz-neutral-500);cursor:not-allowed}\n.nz-field__hint{font-size:var(--text-xs);color:var(--color-nz-neutral-500);margin:8px 0 0}\n.nz-field__error{font-size:var(--text-xs);color:var(--color-nz-error);font-weight:var(--nz-weight-bold);margin:8px 0 0}\n\n/* ---- Table. 2px accent underline on the header, single hairline rows. ---- */\n.nz-table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}\n.nz-table th{text-align:left;padding:12px;background:var(--color-nz-neutral-50);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.06em;border-bottom:2px solid var(--nz-accent)}\n.nz-table td{padding:12px;border-bottom:1px solid var(--color-nz-neutral-200)}\n<\/style>\n  <style>/* NAZDAR WEBFONTS — Campton (licensed, supplied by Nazdar Marketing Communications).\n   Weights map to the brand guide's four: Light 300 / Book 400 / Medium 500 / Bold 700.\n   SemiBold 600 and Black 900 are included for display use only.\n   OTF is served directly; ask Marketing for a woff2 kit if payload size matters. */\n\n\n/* NAZDAR COLOR TOKENS\n   Source: Na ressed fills. Not guaranteed to hold text. */\n  --nz-accent-ink:var(--color-nz-red-dark);  /* TEXT ONLY. Accent-colored text on a light surface. Always clears AA. */\n  --nz-accent-text:#FFFFFF;\n\n  --nz-text-primary:var(--color-nz-gray-dark);\n  --nz-text-secondary:var(--color-nz-gray-cool);\n  --nz-text-link:var(--color-nz-blue-dark);\n  --nz-border:var(--color-nz-neutral-200);\n  --nz-border-strong:var(--color-nz-neutral-300);\n  --nz-border-focus:var(--color-nz-blue-dark);\n  --nz-surface:#FFFFFF;\n  --nz-surface-sunken:var(--color-nz-neutral-50);\n}\n\n/* Division theming. The Z symbol stays red in all three logos, so only the\n   surrounding accent changes. Never recolor the Z.\n\n   --nz-accent-dark and --nz-accent-ink diverge on Ink Technologies and that is\n   deliberate. PMS 576 (#7FA44C) is 2.87:1 on white, so it can be a hover FILL\n   but never TEXT. Rather than invent a darker green outside the official nine,\n   Ink Technologies borrows PMS 432 for accent-colored text: brand-approved and\n   10.95:1. If Marketing Communications approves a darker green, set it here. */\n.nz-theme-master{--nz-accent:var(--color-nz-red);--nz-accent-dark:var(--color-nz-red-dark);--nz-accent-ink:var(--color-nz-red-dark);--nz-accent-text:#FFFFFF}\n.nz-theme-inktech{--nz-accent:var(--color-nz-green);--nz-accent-dark:var(--color-nz-green-dark);--nz-accent-ink:var(--color-nz-gray-dark);--nz-accent-text:var(--color-nz-neutral-900)}\n.nz-theme-sourceone{--nz-accent:var(--color-nz-blue);--nz-accent-dark:var(--color-nz-blue-dark);--nz-accent-ink:var(--color-nz-blue-dark);--nz-accent-text:#FFFFFF}\n\n/* CONFLICTS in the source PDF, unresolved. The guide's hex column disagrees with\n   its own RGB column twice; RGB matches the stated Pantone, so RGB wins.\n   1. Nazdar Red: RGB 207/16/45 = #CF102D (in use), not the guide's #D90000.\n   2. Dark Gray:  RGB 50/62/72  = #323E48 (in use), not the guide's #191919.\n   If Marketing rules the other way, change those two values here. Nothing else moves. */\n\n/* NAZDAR TYPOGRAPHY TOKENS\n\n   Campton is the brand face in Light 300 / Book 400 / Medium 500 / Bold 700.\n   The licensed webfont ships with this system — see tokens/fonts.css.\n   The Calibri / Arial fallbacks stay in the stack: they are the guide's own\n   instruction for Microsoft Office output and for any surface that cannot\n   load the webfont. Never substitute a Google Font lookalike (Montserrat,\n   Poppins, Jost). */\n\n:root{\n  --font-display:\"Campton\", Calibri, Arial, Helvetica, sans-serif;\n  --font-body:\"Campton\", Calibri, Arial, Helvetica, sans-serif;\n  --font-mono:ui-monospace, \"SFMono-Regular\", Menlo, Consolas, monospace;\n\n  --nz-weight-light:300;\n  --nz-weight-book:400;\n  --nz-weight-medium:500;\n  --nz-weight-bold:700;\n\n  /* EXTENDED: 1.25 ratio on a 16px base */\n  --text-xs:0.75rem;     /* 12px */\n  --text-sm:0.875rem;    /* 14px */\n  --text-base:1rem;      /* 16px */\n  --text-lg:1.25rem;     /* 20px */\n  --text-xl:1.5625rem;   /* 25px */\n  --text-2xl:1.953rem;   /* 31px */\n  --text-3xl:2.441rem;   /* 39px */\n  --text-4xl:3.052rem;   /* 49px */\n\n  --nz-leading-none:1;\n  --nz-leading-tight:1.15;\n  --nz-leading-snug:1.35;\n  --nz-leading-body:1.55;\n\n  /* Negative tracking on display sizes, wide tracking on small caps labels */\n  --nz-tracking-tight:-0.02em;\n  --nz-tracking-label:0.08em;\n  --nz-tracking-label-wide:0.12em;\n}\n\n/* NAZDAR SPACE, RADII, ELEVATION  (EXTENDED layer, not in the official guide)\n   Spacing runs on a 4px base. Radii stay tight: 2px to 8px. The Z symbol is\n   built from hard angular cuts, so heavy rounding fights the mark. */\n\n:root{\n  --nz-space-1:4px;\n  --nz-space-2:8px;\n  --nz-space-3:12px;\n  --nz-space-4:16px;\n  --nz-space-5:20px;\n  --nz-space-6:24px;\n  --nz-space-8:32px;\n  --nz-space-10:40px;\n  --nz-space-12:48px;\n  --nz-space-16:64px;\n\n  --radius-nz-sm:2px;\n  --radius-nz-md:4px;\n  --radius-nz-lg:8px;\n\n  /* Tinted with the cool blue-slate of PMS 432, never pure black. Never a glow. */\n  --shadow-nz-sm:0 1px 2px rgba(20,25,29,0.08);\n  --shadow-nz-md:0 2px 8px rgba(20,25,29,0.10);\n  --shadow-nz-lg:0 8px 24px rgba(20,25,29,0.12);\n\n  --nz-content-max:1080px; /* @kind spacing */\n  --nz-duration:200ms; /* @kind other */\n  --nz-ease:ease; /* @kind other */\n}\n\n/* NAZDAR BASE. Surfaces are white. Backgrounds are white or a very light cool\n   gray, never colored fields. */\n\nbody{\n  margin:0;\n  background:var(--nz-surface);\n  color:var(--nz-text-primary);\n  font-family:var(--font-body);\n  font-size:var(--text-base);\n  line-height:var(--nz-leading-body);\n  -webkit-font-smoothing:antialiased;\n}\n\na{color:var(--nz-text-link);text-decoration:underline;text-underline-offset:2px}\na:hover{color:var(--color-nz-red-dark)}\n\nh1,h2,h3,h4{font-family:var(--font-display);font-weight:var(--nz-weight-bold);line-height:var(--nz-leading-tight);letter-spacing:var(--nz-tracking-tight);margin:0}\ncode,kbd,pre{font-family:var(--font-mono)}\n\n*:focus-visible{outline:2px solid var(--nz-border-focus);outline-offset:2px}\n\n/* Small uppercase label, the brand's one recurring text device */\n.nz-label{font-size:var(--text-xs);font-weight:var(--nz-weight-bold);text-transform:uppercase;letter-spacing:var(--nz-tracking-label-wide);color:var(--nz-text-secondary)}\n\n/* Angular red rule. A structural echo of the mark's diagonal cut, not a\n   reproduction of it. Never a gradient. */\n.nz-rule-diagonal{height:6px;background:var(--nz-accent);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}\n\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation-duration:0.01ms !important;transition-duration:0.01ms !important}\n}\n\n/* Nazdar component styles. Values transcribed exactly from the source Tailwind\n   utility strings in nazdar-design-system/src/components/*.jsx. No hex here. */\n\n/* ---- Button ---- */\n.nz-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--nz-space-2);font-family:var(--font-body);font-weight:var(--nz-weight-bold);cursor:pointer;border-radius:var(--radius-nz-md);border:1px solid transparent;transition:background-color var(--nz-duration) var(--nz-ease),color var(--nz-duration) var(--nz-ease),border-color var(--nz-duration) var(--nz-ease);text-decoration:none;line-height:var(--nz-leading-snug)}\n.nz-btn--sm{font-size:var(--text-sm);padding:6px 12px}\n.nz-btn--md{font-size:var(--text-base);padding:10px 18px}\n.nz-btn--lg{font-size:var(--text-lg);padding:12px 24px}\n.nz-btn--primary{background:var(--nz-accent);color:var(--nz-accent-text)}\n.nz-btn--primary:hover:not(:disabled){background:var(--nz-accent-dark)}\n.nz-btn--secondary{background:#fff;color:var(--nz-accent-ink);border-color:var(--nz-border-strong)}\n.nz-btn--secondary:hover:not(:disabled){background:var(--color-nz-neutral-50)}\n.nz-btn--destructive{background:var(--color-nz-error);color:#fff}\n.nz-btn--destructive:hover:not(:disabled){filter:brightness(0.9)}\n.nz-btn--quiet{background:transparent;color:var(--nz-text-link);text-decoration:underline;padding-left:6px;padding-right:6px}\n.nz-btn--quiet:hover:not(:disabled){color:var(--nz-accent-ink)}\n.nz-btn:disabled{cursor:not-allowed;background:var(--color-nz-neutral-300);color:var(--color-nz-neutral-500);border-color:transparent;filter:none}\n\n/* ---- Badge ---- */\n.nz-badge{display:inline-block;font-size:10px;font-weight:var(--nz-weight-bold);letter-spacing:0.1em;text-transform:uppercase;padding:3px 7px;border-radius:var(--radius-nz-sm);line-height:1.4}\n.nz-badge--brand{background:var(--color-nz-red-dark);color:#fff}\n.nz-badge--neutral{background:var(--color-nz-neutral-200);color:var(--color-nz-neutral-700)}\n.nz-badge--success{background:var(--color-nz-success-bg);color:var(--color-nz-success)}\n.nz-badge--warning{background:var(--color-nz-warning-bg);color:var(--color-nz-warning)}\n.nz-badge--error{background:var(--color-nz-error-bg);color:var(--color-nz-error)}\n\n/* ---- Card ---- */\n.nz-card{background:#fff;border:1px solid var(--nz-border);border-radius:var(--radius-nz-md);box-shadow:var(--shadow-nz-sm);overflow:hidden}\n.nz-card__head{background:var(--nz-accent);color:var(--nz-accent-text);padding:12px 16px}\n.nz-card__head p{margin:0;font-family:var(--font-display);font-weight:var(--nz-weight-bold);font-size:var(--text-lg)}\n.nz-card__body{padding:16px}\n\n/* ---- Alert. Hard left border, never an icon circle. ---- */\n.nz-alert{display:flex;gap:12px;padding:16px;margin-bottom:12px;border-radius:var(--radius-nz-md);border-left:4px solid;font-size:var(--text-sm)}\n.nz-alert__mark{font-weight:var(--nz-weight-bold);flex-shrink:0}\n.nz-alert__body strong{display:block}\n.nz-alert--success{background:var(--color-nz-success-bg);border-color:var(--color-nz-success);color:var(--color-nz-success-text)}\n.nz-alert--warning{background:var(--color-nz-warning-bg);border-color:var(--color-nz-warning);color:var(--color-nz-warning-text)}\n.nz-alert--error{background:var(--color-nz-error-bg);border-color:var(--color-nz-error);color:var(--color-nz-error-text)}\n.nz-alert--info{background:var(--color-nz-info-bg);border-color:var(--color-nz-info);color:var(--color-nz-info-text)}\n\n/* ---- Field: Input, Select ---- */\n.nz-field{max-width:24rem}\n.nz-field__label{display:block;font-size:var(--text-sm);font-weight:var(--nz-weight-bold);margin-bottom:8px;color:var(--color-nz-gray-dark)}\n.nz-field__control{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:var(--radius-nz-md);background:#fff;color:var(--color-nz-gray-dark);font-family:var(--font-body);font-size:var(--text-base);border:1px solid var(--nz-border-strong);transition:border-color var(--nz-duration) var(--nz-ease)}\n.nz-field__control::placeholder{color:var(--color-nz-neutral-400)}\n.nz-field__control:focus{border-color:var(--color-nz-blue-dark)}\n.nz-field__control--error,.nz-field__control--error:focus{border-color:var(--color-nz-error)}\n.nz-field__control:disabled{background:var(--color-nz-neutral-50);color:var(--color-nz-neutral-500);cursor:not-allowed}\n.nz-field__hint{font-size:var(--text-xs);color:var(--color-nz-neutral-500);margin:8px 0 0}\n.nz-field__error{font-size:var(--text-xs);color:var(--color-nz-error);font-weight:var(--nz-weight-bold);margin:8px 0 0}\n\n/* ---- Table. 2px accent underline on the header, single hairline rows. ---- */\n.nz-table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}\n.nz-table th{text-align:left;padding:12px;background:var(--color-nz-neutral-50);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.06em;border-bottom:2px solid var(--nz-accent)}\n.nz-table td{padding:12px;border-bottom:1px solid var(--color-nz-neutral-200)}\n\n<\/style>\n  <script src=\"54f7cd8d-1da8-4cbd-b632-284fe017862a\"><\/script>\n  <script src=\"b729504a-dc37-46c8-be19-0920490a57c9\"><\/script>\n  <style>\n    *{box-sizing:border-box}\n    a{color:var(--nz-text-link)} a:hover{color:var(--color-nz-red-dark)}\n    .nz-field{max-width:none}\n    :root{--nz-band-dark:#232C33;--nz-band-dark-text:#FFFFFF}\n    :root[data-theme=\"dark\"]{--nz-surface:#14191D;--nz-surface-sunken:#1C2328;--nz-text-primary:#EDEFF1;--nz-text-secondary:#A7B0B8;--nz-border:#323E48;--nz-border-strong:#4E5862;--nz-accent-ink:#F08C98;--nz-band-dark:#323E48;--nz-text-link:#4FB3E6}\n    @media print{.no-print{display:none !important} section{break-inside:avoid}}\n  <\/style>\n<\/helmet>\n\n<div style=\"min-height:100vh;background:var(--nz-surface);color:var(--nz-text-primary);font-family:var(--font-body);transition:background-color 200ms ease,color 200ms ease\">\n\n  <header style=\"border-bottom:1px solid var(--nz-border)\">\n    <div style=\"max-width:1080px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <img src=\"4fd087ba-c28f-4108-a906-e64d050a3293\" alt=\"Nazdar\" style=\"width:165px;height:30px;display:block;background:#fff;padding:2px 4px;border-radius:2px\">\n        <span style=\"width:1px;height:24px;background:var(--nz-border-strong)\"><\/span>\n        <span style=\"font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;color:var(--nz-accent-ink)\">Learning<\/span>\n      <\/div>\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <span style=\"font-size:var(--text-sm);color:var(--nz-text-secondary);white-space:nowrap\">Updated October 13, 2026<\/span>\n        <span class=\"no-print\" style=\"white-space:nowrap;flex-shrink:0\"><x-import component-from-global-scope=\"NazdarDesignSystem_715ce7.Button\" hint-size=\"auto,32px\" size=\"sm\" variant=\"quiet\" sc-camel-on-click=\"{{ toggleTheme }}\">{{ themeLabel }}<\/x-import><\/span>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <main style=\"max-width:1080px;margin:0 auto;padding:0 24px\">\n\n    <section data-screen-label=\"01 Headline\" style=\"padding:64px 0 48px\">\n      <div style=\"font-size:var(--text-sm);font-weight:700;color:var(--nz-accent-ink);margin-bottom:16px\">Frontline listening sessions 2026<\/div>\n      <h1 style=\"font-size:clamp(2.441rem,7vw,3.815rem);line-height:1.05;max-width:14ch;margin-bottom:24px;text-wrap:balance\">What the floor told us<\/h1>\n      <p style=\"max-width:60ch;margin:0;font-size:var(--text-lg);line-height:1.5;font-weight:300;text-wrap:pretty\">Between September 22 and October 13, 2026, 64 manufacturing employees on day and mid shift joined 8 listening sessions with HR. They told us what makes the job work and what gets in the way.<\/p>\n      <div class=\"nz-rule-diagonal\" style=\"margin-top:48px;max-width:280px\"><\/div>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border-bottom:1px solid var(--nz-border)\">\n        <sc-for list=\"{{ facts }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <div style=\"padding:24px 16px 24px 0;display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-4xl);line-height:1;letter-spacing:-0.03em;color:var(--nz-accent-ink)\">{{ f.n }}<\/span>\n            <span style=\"font-size:var(--text-sm);color:var(--nz-text-secondary);max-width:16ch\">{{ f.l }}<\/span>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:32px;margin-top:32px;align-items:start\">\n        <div>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px\"><span style=\"font-size:var(--text-sm);font-weight:700\">The eight sessions<\/span><a href=\"#attendees\" style=\"font-size:var(--text-xs);font-weight:500\">See session details<\/a><\/div>\n          <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px\">\n            <sc-for list=\"{{ sessionStrip }}\" as=\"s\" hint-placeholder-count=\"8\">\n              <div style=\"padding:10px;border:1px solid var(--nz-border);border-top:4px solid {{ s.bar }};border-radius:2px;display:flex;flex-direction:column;gap:2px\">\n                <span style=\"font-weight:700;font-size:var(--text-sm);white-space:nowrap\">{{ s.label }}<\/span>\n                <span style=\"font-size:var(--text-xs);color:var(--nz-text-secondary)\">{{ s.shift }} shift · {{ s.n }}<\/span>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"display:flex;gap:16px;margin-top:8px;font-size:var(--text-xs);color:var(--nz-text-secondary)\">\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:12px;height:4px;background:var(--nz-accent)\"><\/span>Day shift<\/span>\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:12px;height:4px;background:var(--nz-band-dark)\"><\/span>Mid shift<\/span>\n            <span>The number shows how many employees took part<\/span>\n          <\/div>\n        <\/div>\n        <div style=\"border-top:2px solid var(--nz-accent);padding-top:16px\">\n          <div style=\"font-size:var(--text-sm);font-weight:700;margin-bottom:8px\">Why it matters<\/div>\n          <div style=\"display:flex;align-items:baseline;gap:14px\">\n            <span style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-4xl);line-height:1;letter-spacing:-0.03em\">41%<\/span>\n            <span style=\"font-size:var(--text-base);line-height:1.4\">of manufacturing departures happened within the first 30 days on the job.<\/span>\n          <\/div>\n          <p style=\"margin:12px 0 0;font-size:var(--text-sm);color:var(--nz-text-secondary)\">Shared by HR at the first session. Training, onboarding, and the first month came up in every session.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section data-screen-label=\"02 Focus areas\" style=\"padding:56px 0;border-top:1px solid var(--nz-border)\">\n      <div style=\"font-size:var(--text-sm);font-weight:700;color:var(--nz-accent-ink);margin-bottom:12px\">Listening sessions 2026 · 02<\/div>\n      <h2 style=\"font-size:var(--text-2xl);margin-bottom:10px\">Eight focus areas<\/h2>\n      <p style=\"max-width:60ch;margin:0 0 32px;color:var(--nz-text-secondary)\">How many of the 8 sessions raised each area, from most to least. Open an area to see the specific asks behind it.<\/p>\n      <div style=\"display:flex;flex-direction:column;border-top:1px solid var(--nz-border)\">\n        <sc-for list=\"{{ areas }}\" as=\"a\" hint-placeholder-count=\"8\">\n          <div style=\"border-bottom:1px solid var(--nz-border)\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 24px;align-items:center;padding:12px 0\">\n              <span style=\"font-size:var(--text-base);font-weight:500;line-height:1.35\">{{ a.name }}<\/span>\n              <span style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end\">\n                <span style=\"display:flex;gap:3px\" aria-label=\"{{ a.aria }}\">\n                  <sc-for list=\"{{ a.segs }}\" as=\"s\" hint-placeholder-count=\"8\"><span style=\"width:18px;height:18px;border-radius:2px;background:{{ s }}\"><\/span><\/sc-for>\n                <\/span>\n                <span style=\"font-size:var(--text-sm);font-weight:700;min-width:44px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap\">{{ a.r }} of 8<\/span>\n                <span class=\"no-print\" style=\"min-width:104px;display:flex;justify-content:flex-end\"><x-import component-from-global-scope=\"NazdarDesignSystem_715ce7.Button\" hint-size=\"auto,32px\" size=\"sm\" variant=\"quiet\" aria-expanded=\"{{ a.expanded }}\" sc-camel-on-click=\"{{ a.toggle }}\">{{ a.toggleLabel }}<\/x-import><\/span>\n              <\/span>\n            <\/div>\n            <sc-if value=\"{{ a.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:var(--nz-surface-sunken);border:1px solid var(--nz-border);border-radius:4px;padding:4px 16px;margin-bottom:16px\">\n                <sc-for list=\"{{ a.asks }}\" as=\"x\" hint-placeholder-count=\"4\">\n                  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--nz-border);align-items:start\">\n                    <div>\n                      <div style=\"font-weight:500;line-height:1.4\">{{ x.t }}<\/div>\n                      <div style=\"font-size:var(--text-xs);color:var(--nz-text-secondary);margin-top:4px;line-height:1.5\">{{ x.meta }}<\/div>\n                    <\/div>\n                    <span style=\"white-space:nowrap\"><x-import component-from-global-scope=\"NazdarDesignSystem_715ce7.Badge\" hint-size=\"auto,20px\" tone=\"{{ x.tone }}\">{{ x.st }}<\/x-import><\/span>\n                  <\/div>\n                <\/sc-for>\n              <\/div>\n            <\/sc-if>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/section>\n\n    <section data-screen-label=\"03 What keeps people\" style=\"padding:56px 0;border-top:1px solid var(--nz-border)\">\n      <div style=\"font-size:var(--text-sm);font-weight:700;color:var(--nz-accent-ink);margin-bottom:12px\">Listening sessions 2026 · 03<\/div>\n      <h2 style=\"font-size:var(--text-2xl);margin-bottom:10px\">What keeps people here<\/h2>\n      <p style=\"max-width:60ch;margin:0 0 32px;color:var(--nz-text-secondary)\">Reasons employees gave for staying, and how many sessions named each one. These are the strengths to protect while making changes.<\/p>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));column-gap:40px;border-top:1px solid var(--nz-border)\">\n        <sc-for list=\"{{ keep }}\" as=\"k\" hint-placeholder-count=\"6\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--nz-border)\">\n            <span style=\"font-weight:500\">{{ k.name }}<\/span>\n            <span style=\"display:flex;align-items:center;gap:10px\" aria-label=\"{{ k.aria }}\">\n              <span style=\"display:flex;gap:2px\"><sc-for list=\"{{ k.segs }}\" as=\"s\" hint-placeholder-count=\"8\"><span style=\"width:10px;height:14px;border-radius:1px;background:{{ s }}\"><\/span><\/sc-for><\/span>\n              <span style=\"font-size:var(--text-sm);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums\">{{ k.r }} of 8<\/span>\n            <\/span>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n      <p style=\"margin:12px 0 0;font-size:var(--text-xs);color:var(--nz-text-secondary)\">Counted from the session summaries. The October 1 summary did not list reasons for staying.<\/p>\n    <\/section>\n\n    <section data-screen-label=\"04 We listened\" style=\"padding:56px 0;border-top:1px solid var(--nz-border)\">\n      <div style=\"font-size:var(--text-sm);font-weight:700;color:var(--nz-accent-ink);margin-bottom:12px\">Listening sessions 2026 · 04<\/div>\n      <h2 style=\"font-size:var(--text-2xl);margin-bottom:10px\">We listened: already done or underway<\/h2>\n      <p style=\"max-width:60ch;margin:0 0 32px;color:var(--nz-text-secondary)\">Changes that came out of what employees told us.<\/p>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:40px\">\n        <sc-for list=\"{{ progress }}\" as=\"g\" hint-placeholder-count=\"2\">\n          <div>\n            <div style=\"display:flex;align-items:baseline;gap:14px;padding-bottom:14px;border-bottom:2px solid var(--nz-accent)\">\n              <span style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-4xl);line-height:1;letter-spacing:-0.03em\">{{ g.count }}<\/span>\n              <span style=\"font-family:var(--font-display);font-weight:700;font-size:var(--text-xl)\">{{ g.title }}<\/span>\n            <\/div>\n            <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--nz-border)\">\n                <span style=\"white-space:nowrap\"><x-import component-from-global-scope=\"NazdarDesignSystem_715ce7.Badge\" hint-size=\"auto,20px\" tone=\"{{ g.tone }}\">{{ g.badge }}<\/x-import><\/span>\n                <span style=\"font-size:var(--text-base);line-height:1.4\">{{ it }}<\/span>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/section>\n\n    <section data-screen-label=\"05 Small and large wins\" style=\"padding:56px 0;border-top:1px solid var(--nz-border)\">\n      <div style=\"font-size:var(--text-sm);font-weight:700;color:var(--nz-accent-ink);margin-bottom:12px\">Listening sessions 2026 · 05<\/div>\n      <h2 style=\"font-size:clamp(1.953rem,4vw,2.4 utton\" hint-size=\"auto,32px\" size=\"sm\" variant=\"{{ c.variant }}\" aria-pressed=\"{{ c.pressed }}\" sc-camel-on-click=\"{{ c.onClick }}\">{{ c.label }}<\/x-import>\n            <\/sc-for>\n          <\/div>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px\">\n            <div aria-live=\"polite\" style=\"font-size:var(--text-sm);color:var(--nz-text-secondary)\">{{ countText }}<\/div>\n            <div class=\"no-print\" style=\"display:flex;gap:8px\">\n              <x-import component-from-global-scope=\"NazdarDesignSystem_715ce7.Button\" hint-size=\"auto,32px\" size=\"sm\" variant=\"quiet\" sc-camel-on-click=\"{{ reset }}\">Clear filters<\/x-import>\n              <x-import component-from-global-scope=\"NazdarDesignSystem_715ce7.Button\" hint-size=\"auto,32px\" size=\"sm\" variant=\"secondary\" sc-camel-on-click=\"{{ csv }}\">Download CSV<\/x-import>\n            <\/div>\n          <\/div>\n          <div style=\"overflow-x:auto;border:1px solid var(--nz-border);border-radius:4px\">\n            <sc-raw-table class=\"nz-table\" style=\"min-width:820px\">\n              <sc-raw-thead><sc-raw-tr>\n                <sc-raw-th scope=\"col\" style=\"background:var(--nz-surface-sunken)\">Ask<\/sc-raw-th>\n                <sc-raw-th scope=\"col\" style=\"background:var(--nz-surface-sunken)\">Sessions<\/sc-raw-th>\n                <sc-raw-th scope=\"col\" style=\"background:var(--nz-surface-sunken)\">Type<\/sc-raw-th>\n                <sc-raw-th scope=\"col\" style=\"background:var(--nz-surface-sunken)\">Suggested owner<\/sc-raw-th>\n                <sc-raw-th scope=\"col\" style=\"background:var(--nz-surface-sunken)\">Effort<\/sc-raw-th>\n                <sc-raw-th scope=\"col\" style=\"background:var(--nz-surface-sunken)\">Status<\/sc-raw-th>\n              <\/sc-raw-tr><\/sc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ rows }}\" as=\"i\" hint-placeholder-count=\"8\">\n                  <sc-raw-tr>\n                    <sc-raw-td style=\"vertical-align:top;border-color:var(--nz-border);max-width:400px\">\n                      <div style=\"font-weight:500;line-height:1.35\">{{ i.t }}<\/div>\n                      <sc-if value=\"{{ i.n }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:var(--text-sm);margin-top:4px;font-style:italic;font-weight:300\">{{ i.n }}<\/div><\/sc-if>\n                      <div style=\"font-size:var(--text-xs);color:var(--nz-text-secondary);margin-top:4px\">{{ i.areaName }}<\/div>\n                    <\/sc-raw-td>\n                    <sc-raw-td style=\"vertical-align:top;border-color:var(--nz-border);white-space:nowrap\">\n                      <span aria-label=\"{{ i.dotsAria }}\" style=\"display:flex;align-items:center;gap:2px\">\n                        <sc-for list=\"{{ i.dots }}\" as=\"d\" hint-placeholder-count=\"8\"><span title=\"{{ d.label }}\" style=\"width:6px;height:14px;border-radius:1px;background:{{ d.bg }}\"><\/span><\/sc-for>\n                        <span style=\"font-size:var(--text-sm);font-weight:700;margin-left:8px\">{{ i.count }}<\/span>\n                      <\/span>\n                    <\/sc-raw-td>\n                    <sc-raw-td style=\"vertical-align:top;border-color:var(--nz-border);white-space:nowrap\">{{ i.ty }}<\/sc-raw-td>\n                    <sc-raw-td style=\"vertical-align:top;border-color:var(--nz-border)\">{{ i.o }}<\/sc-raw-td>\n                    <sc-raw-td style=\"vertical-align:top;border-color:var(--nz-border)\">{{ i.e }}<\/sc-raw-td>\n                    <sc-raw-td style=\"vertical-align:top;border-color:var(--nz-border);white-space:nowrap\"><x-import component-from-global-scope=\"NazdarDesignSystem_715ce7.Badge\" hint-size=\"auto,20px\" tone=\"{{ i.tone }}\">{{ i.st }}<\/x-import><\/sc-raw-td>\n                  <\/sc-raw-tr>\n                <\/sc-for>\n                <sc-if value=\"{{ isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                  <sc-raw-tr><sc-raw-td colspan=\"6\" style=\"padding:32px;color:var(--nz-text-secondary)\">No asks match these filters. Clear filters to see everything.<\/sc-raw-td><\/sc-raw-tr>\n                <\/sc-if>\n              <\/sc-raw-tbody>\n            <\/sc-raw-table>\n          <\/div>\n        <\/div>\n      <\/sc-if>\n    <\/section>\n    <section id=\"attendees\" data-screen-label=\"10 Attendees\" style=\"padding:56px 0 72px;border-top:1px solid var(--nz-border)\">\n      <div style=\"font-size:var(--text-sm);font-weight:700;color:var(--nz-accent-ink);margin-bottom:12px\">Listening sessions 2026 · Appendix<\/div>\n      <h2 style=\"font-size:var(--text-2xl);margin-bottom:10px\">Session schedule<\/h2>\n      <p style=\"max-width:60ch;margin:0 0 32px;color:var(--nz-text-secondary)\">64 employees across 8 sessions, all held in the SHA Classroom. Sessions are listed by date.<\/p>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px\">\n        <sc-for list=\"{{ attendees }}\" as=\"s\" hint-placeholder-count=\"8\">\n          <div style=\"border:1px solid var(--nz-border);border-top:4px solid {{ s.bar }};border-radius:4px;background:var(--nz-surface);box-shadow:0 1px 2px rgba(20,25,29,.08);padding:16px;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\">\n                <span style=\"font-weight:700\">{{ s.name }}<\/span>\n                <span style=\"font-size:var(--text-xs);color:var(--nz-text-secondary);white-space:nowrap\">{{ s.n }} attendees<\/span>\n              <\/div>\n              <span style=\"font-size:var(--text-sm)\">{{ s.date }}<\/span>\n              <span style=\"font-size:var(--text-xs);color:var(--nz-text-secondary)\">{{ s.time }} · {{ s.shift }} shift<\/span>\n            <\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/section>\n  <\/main>\n\n  <footer style=\"border-top:1px solid var(--nz-border);background:var(--nz-surface-sunken)\">\n    <div style=\"max-width:1080px;margin:0 auto;padding:32px 24px 48px;display:flex;flex-direction:column;gap:8px\">\n      <p style=\"max-width:70ch;margin:0;font-size:var(--text-base)\">Notes were taken on themes, not names. Nothing here is attributed to any one person.<\/p>\n      <p style=\"margin:0;font-size:var(--text-sm);color:var(--nz-text-secondary)\">Updated October 13, 2026<\/p>\n    <\/div>\n  <\/footer>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;winsLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;side by side&quot;,&quot;stacked&quot;],&quot;default&quot;:&quot;side by side&quot;,&quot;tsType&quot;:&quot;'side by side'|'stacked'&quot;,&quot;section&quot;:&quot;Small and large wins&quot;},&quot;showReach&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Small and large wins&quot;}}\">\nclass Component extends DCLogic {\n  static AREAS = [\n    [\"Standardized training and qualification\",8,0],[\"Material availability and planning\",8,1],[\"Smooth shift handoffs\",8,2],[\"Equipment and workflow bottlenecks\",8,6],\n    [\"Basic safety\",8,5],[\"Leadership visibility and accountability on the floor\",8,7],[\"Follow-through on employee concerns\",6,4],[\"Clear, consistent priorities\",4,3]\n  ];\n  static KEEP = [[\"Coworkers and relationships\",7],[\"Schedule fit\",4],[\"Stability and predictable work\",4],[\"Culture and belonging\",4],[\"Room to learn and grow\",4],[\"Benefits\",3]];\n  static DONE = [\"Manufacturing employees received a $2 an hour raise\",\"The referral bonus doubled to $1,400\",\"New hires learn the boot requirements before day one, and boots are on hand if needed\",\"Employees can reach HR resources on their phones using their time clock badge login\"];\n  static UNDERWAY = [\"A communication wall with company news, safety information, and QR codes for benefits\",\"An updated attendance policy takes effect January 1\",\"A train-the-trainer program, so every trainer teaches the same way\",\"Production employees are joining the engagement committee\"];\n  static SMALL = [\n    [\"Confirm materials are physically on hand before a batch starts.\",8,[\"Confirm materials are physically\"]],\n    [\"Use a shift handoff checklist that both leads sign, with set times for cleanup.\",6,[\"Shift handoff checklist\"]],\n    [\"Keep new hires on one line until they're comfortable running it.\",5,[\"Keep new hires on one line\"]],\n    [\"Replace the tablet test with a hands-on final check, because the tablet test can be passed by guessing.\",5,[\"Hands-on final check\"]],\n    [\"Before every shift ends, charge batteries, scan stock, and split orders so the next shift can start right away.\",4,[\"Charge batteries\"]],\n    [\"Explain chemical safety when people are hired and again in orientation.\",4,[\"Explain chemical safety\"]],\n    [\"Let trained volunteers help in other areas, including working half days of overtime.\",4,[\"Let trained volunteers\"]],\n    [\"Give candidates a realistic job preview, including time with employees doing the job.\",4,[\"Realistic job preview\"]],\n    [\"Keep one list of priority orders per shift that every area can see.\",3,[\"One hot list per shift\"]],\n    [\"Recognize good work, especially during tough stretches.\",3,[\"Recognize good work\"]]\n  ];\n  static LARGE = [\n    [\"New hire training system\",\"Put a dedicated trainer in each area who is paid more, give new hires 30 days of training, and finish with a hands-on final check.\",8,[\"Dedicated trainer in each area\",\"At least 30 days of training\",\"Hands-on final check\",\"Train-the-trainer\"]],\n    [\"Career path\",\"Bring back the specialist program, or replace it, so experienced specialists do the training and have a path to grow.\",8,[\"Revive or replace the specialist\",\"A day shift specialist\"]],\n    [\"Safety program\",\"Make sure no one works alone where an injury could go unnoticed, lock out machines before repairs, inspect lifts and hoists, review heat and PPE, and add powered movers for heavy tubs.\",7,[\"No one works alone\",\"Lock out machines\",\"Inspect tub hoist\",\"Inspect the small batch rack\",\"Review heat and new hire PPE\",\"Pallet jacks or powered movers\"]],\n    [\"Leadership on the floor\",\"Leads know the work they lead and work alongside the team when it is short-staffed.\",7,[\"Leads know the work\",\"Leads huddle together\",\"Act on staffing gaps\"]],\n    [\"Equipment reliability\",\"Buy dedicated scale batteries and charging stations, add backup label printers with regular maintenance, buy more tubs, and cover maintenance after 4:00 PM.\",6,[\"Dedicated scale batteries\",\"Backup label printers\",\"Buy more tubs\",\"Maintenance coverage after 4:00 PM\"]],\n    [\"Materials and planning\",\"Set aside materials when a batch ticket prints, keep inventory counts accurate, and show which materials are still in transit.\",5,[\"Allocate materials when a ticket\",\"Scan materials back\",\"Show whether material is pulled\"]],\n    [\"Hiring and the first 30 days\",\"Use one simple application, show candidates what the job is really like, and hire before the summer heat.\",5,[\"One application where candidates\",\"Realistic job preview\",\"Hire and hold job fairs\"]]\n  ];\n  static DECISIONS = [\n    [\"What should leads be expected to know about the work they lead?\",[\"Leads know the work\",\"Clarify what trainers are accountable\"]],\n    [\"How should trainers be paid, and what should they be accountable for?\",[\"Dedicated trainer in each area\",\"Trainers have at least a year\",\"Clarify what trainers are accountable\"]],\n    [\"Should the specialist program be brought back, replaced, or retired?\",[\"Revive or replace the specialist\",\"A day shift specialist\"]],\n    [\"Should maintenance be available to mid shift after 4:00 PM?\",[\"Maintenance coverage after 4:00 PM\",\"More maintenance training on digital\"]],\n    [\"How much should be invested in more tubs and more reliable equipment?\",[\"Buy more tubs\",\"Dedicated scale batteries\",\"Backup label printers\",\"Rebuild aging lines\"]],\n    [\"How will commitments made to employees who joined from Fuji be honored?\",[\"Honor commitments made to former Fuji\"]]\n  ];\n  static SPLITS = [\n    {t:\"Stepping into the morning leads meeting (DVS)\",la:\"Employees\",a:\"Want to be able to step into the morning leads meeting when they need help.\",lb:\"Leadership's view\",b:\"Jesse said no to interrupting DVS.\"},\n    {t:\"Holiday time off\",la:\"One group's view\",a:\"Rotating who gets holidays off is fair, because everyone gets a turn.\",lb:\"Another group's view\",b:\"Rotating holidays ignores seniority, and it makes it hard to plan ahead.\"},\n    {t:\"Attendance points dropping off sooner\",la:\"Some employees\",a:\"Want attendance points to drop off their record sooner.\",lb:\"Other employees\",b:\"Worry that a shorter window would make it easier to call in, leaving the rest of the team short.\"},\n    {t:\"What leads should know\",la:\"Leadership's view\",a:\"A lead doesn't need to know how to do every job in their area on a day-to-day basis.\",lb:\"The floor's view\",b:\"A lead should know the work they lead, or at least be willing to learn it.\"},\n    {t:\"Shift handoffs\",la:\"Day shift's view\",a:\"Mid shift often leaves work areas uncleaned and tasks unfinished for day shift to pick up.\",lb:\"Mid shift's view\",b:\"Day shift often leaves work areas uncleaned and tasks unfinished for mid shift to pick up.\"},\n    {t:\"The 5:30 AM start\",la:\"Many employees\",a:\"Like the early start because they get off work early in the afternoon.\",lb:\"Other employees\",b:\"Say the early start discourages job candidates and makes it harder to refer friends.\"}\n  ];\n  static STEPS = [\n    {when:\"Week of October 19\",what:\"HR walks manufacturing leadership through what employees said.\"},\n    {when:\"Next\",what:\"Executives review the plan and name an owner for each action.\"},\n    {when:\"Then\",what:\"Employees hear what is changing through morning huddles, the communication wall, and a printed update.\"}\n  ];\n  static TYPES = [\"Quick win\",\"Safety\",\"Decision\",\"Budget\",\"Policy\",\"Review\"];\n\n  state = { theme:null, D:null, openArea:null, openWin:null, openDec:null, minReach:0, showAll:false, q:\"\", fArea:\"\", fSession:\"\", fStatus:\"\", types:[] };\n\n  componentDidMount() {\n    this.applyTheme();\n    const load = () => window.LISTENING_DATA ? this.setState({ D:window.LISTENING_DATA }) : setTimeout(load, 30); load();\n  }\n  componentDidUpdate() { this.applyTheme(); }\n  applyTheme() { if (this.state.theme) document.documentElement.dataset.theme = this.state.theme; }\n  current() { return this.state.theme || \"light\"; }\n  segs(r) { return Array.from({length:8}, (_,i) => i < r ? \"var(--nz-accent)\" : \"var(--nz-border)\"); }\n  stLabel(st) { return st===\"In motion\" ? \"Underway\" : st; }\n  tone(st) { return st===\"Done\" ? \"success\" : st===\"In motion\" ? \"warning\" : \"neutral\"; }\n  items() { return this.state.D ? this.state.D.ITEMS : []; }\n  find(keys) { const I = this.items(); return keys.map(k => I.find(i => i.t.startsWith(k))).filter(Boolean); }\n  askRow(i) {\n    const S = this.state.D.SESSIONS;\n    const dates = S.filter(s => i.s.includes(s.k)).map(s => s.label).join(\", \");\n    return { t:i.t, st:this.stLabel(i.st), tone:this.tone(i.st), meta:`Suggested owner: ${i.o}. Effort: ${i.e.toLowerCase()}. Raised in ${i.s.length} of 8 sessions (${dates}).` };\n  }\n  toggler(key, id, label) {\n    const open = this.state[key] === id;\n    return { open, expanded: open ? \"true\" : \"false\", toggleLabel: open ? \"Hide\" : label, toggle: () => this.setState({ [key]: open ? null : id }) };\n  }\n  filtered() {\n    const s = this.state, D = s.D; if (!D) return [];\n    const score = i => (i.ty===\"Safety\"?1000:0) + i.s.length*10 + (i.ty===\"Quick win\"?1:0);\n    return D.ITEMS.filter(i =>\n      (!s.q || (i.t+\" \"+(i.n||\"\")+\" \"+i.o+\" \"+D.AREAS[i.a]).toLowerCase().includes(s.q.toLowerCase())) &&\n      (s.fArea===\"\" || i.a==s.fArea) && (!s.fSession || i.s.includes(s.fSession)) &&\n      (!s.fStatus || i.st===s.fStatus) && (!s.types.length || s.types.includes(i.ty))\n    ).sort((x,y) => score(y)-score(x));\n  }\n  downloadCsv() {\n    const A = this.state.D.AREAS;\n    const head = [\"Ask\",\"Note\",\"Area\",\"Sessions raised\",\"Type\",\"Suggested owner\",\"Effort\",\"Status\"];\n    const rows = this.filtered().map(i => [i.t,i.n||\"\",A[i.a],i.s.length,i.ty,i.o,i.e,i.st]);\n    const csv = [head,...rows].map(r => r.map(v => `\"${String(v).replace(/\"/g,'\"\"')}\"`).join(\",\")).join(\"\\r\\n\");\n    const a = document.createElement(\"a\");\n    a.href = URL.createObjectURL(new Blob([csv],{type:\"text/csv\"}));\n    a.download = \"listening-session-asks.csv\"; a.click(); URL.revokeObjectURL(a.href);\n  }\n  renderVals() {\n    const C = Component, s = this.state, D = s.D, ready = !!D;\n    const layout = this.props.winsLayout ?? \"side by side\";\n    const showReach = this.props.showReach ?? true;\n    const pad = n => String(n).padStart(2,\"0\");\n    const I = this.items();\n    const list = this.filtered();\n    const winItem = (id, head, text, r, keys) => {\n      const asks = ready ? this.find(keys).map(i => this.askRow(i)) : [];\n      return { head, text, r, aria:`Raised in ${r} of 8 sessions`, segs:this.segs(r), asks,\n        ...this.toggler(\"openWin\", id, keys.length > 1 ? `View ${asks.length} related asks` : \"View details\") };\n    };\n    const small = C.SMALL.filter(w => w[1] >= s.minReach).map(w => winItem(\"s\"+w[0], \"\", w[0], w[1], w[2]));\n    const large = C.LARGE.filter(w => w[2] >= s.minReach).map(w => winItem(\"l\"+w[0], w[0], w[1], w[2], w[3]));\n    return {\n      themeLabel: this.current() === \"dark\" ? \"Light mode\" : \"Dark mode\",\n      toggleTheme: () => this.setState({ theme: this.current() === \"dark\" ? \"light\" : \"dark\" }),\n      facts: [{n:8,l:\"sessions\"},{n:64,l:\"employees\"},{n:8,l:\"focus areas\"},{n:C.DONE.length + C.UNDERWAY.length,l:\"changes already made or underway\"}],\n      sessionStrip: ready ? D.SESSIONS.map(x => ({ ...x, bar: x.shift===\"Mid\" ? \"var(--nz-band-dark)\" : \"var(--nz-accent)\" })) : [],\n      attendees: ready ? D.SESSIONS.map(x => ({ ...x, bar: x.shift===\"Mid\" ? \"var(--nz-band-dark)\" : \"var(--nz-accent)\" })) : [],\n      areas: C.AREAS.map(([name,r,idx]) => {\n        const asks = I.filter(i => i.a===idx).sort((x,y) => y.s.length-x.s.length).map(i => this.askRow(i));\n        return { name, r, aria:`Raised in ${r} of 8 sessions`, segs:this.segs(r), asks, ...this.toggler(\"openArea\", idx, `View ${asks.length} asks`) };\n      }),\n      keep: C.KEEP.map(([name,r]) => ({ name, r, aria:`Named in ${r} of 8 sessions`, segs:this.segs(r) })),\n      progress: [\n        { title:\"Done\", count:C.DONE.length, badge:\"Done\", tone:\"success\", items:C.DONE },\n        { title:\"Underway\", count:C.UNDERWAY.length, badge:\"Underway\", tone:\"warning\", items:C.UNDERWAY }\n      ],\n      reachChips: [[0,\"All\"],[5,\"Raised in 5 or more sessions\"],[8,\"Raised in all 8\"]].map(([v,label]) => ({\n        label, variant: s.minReach===v ? \"primary\" : \"secondary\", pressed: s.minReach===v ? \"true\" : \"false\",\n        onClick: () => this.setState({ minReach:v, openWin:null }) })),\n      winsCols: layout === \"stacked\" ? \"minmax(0,1fr)\" : \"repeat(auto-fit,minmax(min(100%,420px),1fr))\",\n      showReach,\n      wins: [\n        { title:\"Small wins\", rule:\"Low-cost changes that one owner can make within 30 days.\", count:small.length, empty:!small.length,\n          band:\"var(--nz-accent)\", bandText:\"var(--nz-accent-text)\", textSize:\"var(--text-base)\", items:small },\n        { title:\"Large wins\", rule:\"Changes that need a leadership decision, a budget, or 60 to 180 days to put in place.\", count:large.length, empty:!large.length,\n          band:\"var(--nz-band-dark)\", bandText:\"var(--nz-band-dark-text)\", textSize:\"var(--text-sm)\", items:large }\n      ],\n      decisions: C.DECISIONS.map(([t,keys],i) => {\n        const found = ready ? this.find(keys) : [];\n        const max = found.reduce((m,x) => Math.max(m, x.s.length), 0);\n        return { n:pad(i+1), t, reach: ready ? `Raised in up to ${max} of 8 sessions` : \"\", asks: found.map(x => this.askRow(x)), ...this.toggler(\"openDec\", i, \"View asks\") };\n      }),\n      splits: C.SPLITS,\n      steps: C.STEPS.map((x,i) => ({ ...x, n:pad(i+1), bar: i===0 ? \"var(--nz-accent)\" : \"var(--nz-border-strong)\" })),\n      allIntro: `All ${I.length || 93} asks from the sessions with suggested owner, effort, and status. Owners are suggested until leadership confirms them.`,\n      showAll: s.showAll, showAllExpanded: s.showAll ? \"true\" : \"false\",\n      showAllLabel: s.showAll ? \"Hide the list\" : `Show all ${I.length || 93} asks`,\n      toggleAll: () => this.setState({ showAll: !s.showAll }),\n      q:s.q, fArea:s.fArea, fSession:s.fSession, fStatus:s.fStatus,\n      onQ: e => this.setState({ q:e.target.value }),\n      onArea: e => this.setState({ fArea:e.target.value }),\n      onSession: e => this.setState({ fSession:e.target.value }),\n      onStatus: e => this.setState({ fStatus:e.target.value }),\n      areaOptions: [{value:\"\",label:\"All areas\"}, ...(ready ? D.AREAS.map((a,i) => ({value:String(i),label:a})) : [])],\n      sessionOptions: [{value:\"\",label:\"All sessions\"}, ...(ready ? D.SESSIONS.map(x => ({value:x.k,label:`${x.label}, ${x.shift.toLowerCase()} shift`})) : [])],\n      statusOptions: [{value:\"\",label:\"Any status\"}, ...[\"Done\",\"In motion\",\"Not started\",\"Declined\"].map(x => ({value:x,label:this.stLabel(x)}))],\n      typeChips: C.TYPES.map(t => {\n        const on = s.types.includes(t);\n        return { label: t===\"Quick win\" ? \"Quick wins\" : t, variant: on ? \"primary\" : \"secondary\", pressed: on ? \"true\" : \"false\",\n          onClick: () => this.setState(p => ({ types: on ? p.types.filter(x => x!==t) : [...p.types, t] })) };\n      }),\n      countText: `Showing ${list.length} of ${I.length} asks`,\n      reset: () => this.setState({ q:\"\", fArea:\"\", fSession:\"\", fStatus:\"\", types:[] }),\n      csv: () => this.downloadCsv(),\n      isEmpty: ready && list.length === 0,\n      rows: !ready ? [] : list.map(i => ({\n        ...i, st:this.stLabel(i.st), n:i.n||\"\", areaName:D.AREAS[i.a], count:i.s.length, tone:this.tone(i.st),\n        dotsAria:`Raised in ${i.s.length} of 8 sessions`,\n        dots: D.SESSIONS.map(x => ({ label:x.label, bg: i.s.includes(x.k) ? \"var(--nz-accent)\" : \"var(--nz-border)\" }))\n      }))\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
